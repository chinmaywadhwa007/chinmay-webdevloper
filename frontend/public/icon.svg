<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="cwFaviconRibbon" x1="0%" y1="20%" x2="100%" y2="80%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="30%" stopColor="#D7C8FF" />
      <stop offset="70%" stopColor="#FFCDB2" />
      <stop offset="100%" stopColor="#FFE6BF" />
    </linearGradient>
    <radialGradient id="cwFaviconNode" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stopColor="#FFFFFF" />
      <stop offset="50%" stopColor="#FFE6BF" />
      <stop offset="100%" stopColor="rgba(255, 205, 178, 0)" />
    </radialGradient>
    <filter id="cwFaviconGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Background rounded squircle matching brand identity board -->
  <rect width="180" height="180" rx="42" fill="#0B0C10" stroke="rgba(255, 255, 255, 0.12)" stroke-width="2" />

  <!-- Signature Mark Ribbon Scaled for 180x180 Favicon -->
  <g transform="translate(14, 46) scale(0.98)" filter="url(#cwFaviconGlow)">
    <!-- Continuous CW Ribbon -->
    <path
      d="M 48 27 L 30 27 C 18 27 12 34 12 43 C 12 52 18 59 30 59 L 52 59 C 58 59 62 50 66 33 L 78 59 L 93 33 L 107 59 C 113 59 122 47 136 17"
      stroke="url(#cwFaviconRibbon)"
      stroke-width="7.5"
      stroke-linecap="round"
      stroke-linejoin="round"
    />

    <!-- Glowing Node Halo -->
    <circle cx="136" cy="17" r="16" fill="url(#cwFaviconNode)" opacity="0.8" />
    
    <!-- Glowing Node Core -->
    <circle cx="136" cy="17" r="6" fill="#FFFFFF" />
  </g>
</svg>